# YOLO11 多线程视频推理配置
# 路径按 build 目录运行时的相对路径填写。

[video]
# RKNN 模型路径
model_path=../weights/yolo11n.rknn

# 视频文件路径或摄像头编号；例如 ../medias/palace.mp4 或 0
video_source=../medias/palace.mp4

# 类别标签文件路径
labels_path=../coco_80_labels_list.txt

# 是否保存结果视频：1 保存，0 不保存
record=1

# 是否弹窗显示：1 显示，0 不显示
# 板端没有桌面环境或 DISPLAY 时建议保持 0。
show_window=0

# 保存结果视频路径，仅 record=1 时生效
output_path=thread_pool_demo.mp4

# benchmark=1 时进入非阻塞性能测试模式：
# - 不保存视频；show_window=1 时仍会弹窗显示最新完成帧
# - 显示线程非阻塞回收最新结果，旧帧会被丢弃，避免按帧号等待造成流水线回压
# - 文件视频会自动循环，持续 benchmark_seconds 秒
# 想测试“弹窗显示时的 NPU 利用率”，设置 benchmark=1 且 show_window=1。
benchmark=0
benchmark_seconds=30
loop_video=0

# RK3588 建议从 3、6、9、12 分别测试，观察 NPU load 和 CPU 占用
threads=3

# COCO 模型为 80 类
class_num=80

# 检测框置信度阈值；score_sum 快速过滤也使用该阈值
box_thresh=0.25

# NMS 阈值
nms_thresh=0.45
